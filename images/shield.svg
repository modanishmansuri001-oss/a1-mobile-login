
<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 420 520"
width="420"
height="520">

<defs>

<!-- Outer Glow -->
<radialGradient id="outerGlow"
cx="50%" cy="38%" r="72%">
<stop offset="0%" stop-color="#72BEFF" stop-opacity="0.85"/>
<stop offset="55%" stop-color="#3B86FF" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#3B86FF" stop-opacity="0"/>
</radialGradient>

<!-- Main Shield -->
<linearGradient id="shieldMain"
x1="0%" y1="0%"
x2="0%" y2="100%">

<stop offset="0%" stop-color="#5EC6FF"/>
<stop offset="18%" stop-color="#3296FF"/>
<stop offset="55%" stop-color="#0B63F5"/>
<stop offset="100%" stop-color="#0838B9"/>

</linearGradient>

<!-- Inner Light -->
<linearGradient id="innerLight"
x1="0%" y1="0%"
x2="100%" y2="100%">

<stop offset="0%" stop-color="#FFFFFF" stop-opacity=".95"/>
<stop offset="30%" stop-color="#C8ECFF" stop-opacity=".45"/>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>

</linearGradient>

  <!-- Blur -->
<filter id="blur40">
  <feGaussianBlur stdDeviation="40"/>
</filter>

<!-- Soft Blur -->
<filter id="blur12">
  <feGaussianBlur stdDeviation="12"/>
</filter>

<!-- Glow -->
<filter id="glow">
  <feGaussianBlur stdDeviation="10" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

</defs>

<!-- OUTER GLOW -->
<ellipse
cx="210"
cy="215"
rx="170"
ry="215"
fill="url(#outerGlow)"
filter="url(#blur40)"
opacity=".95"/>
<!-- MAIN SHIELD -->
<path
d="M210 35
C305 55 360 110 360 205
L360 275
C360 365 305 435 210 492
C115 435 60 365 60 275
L60 205
C60 110 115 55 210 35Z"
fill="url(#shieldMain)"
filter="url(#glow)"/>
