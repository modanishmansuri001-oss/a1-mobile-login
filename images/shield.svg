
<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 420 520"
width="420"
height="520">

<defs>

<!-- Outer Glow -->
<radialGradient id="outerGlow"
cx="50%" cy="38%" r="72%">
<stop offset="0%" stop-color="#72BEFF" stop-opacity="0.85"/>
<stop offset="55%" stop-color="#3B86FF" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#3B86FF" stop-opacity="0"/>
</radialGradient>

<!-- Main Shield -->
<linearGradient id="shieldMain"
x1="0%" y1="0%"
x2="0%" y2="100%">

<stop offset="0%" stop-color="#5EC6FF"/>
<stop offset="18%" stop-color="#3296FF"/>
<stop offset="55%" stop-color="#0B63F5"/>
<stop offset="100%" stop-color="#0838B9"/>

</linearGradient>

<!-- Inner Light -->
<linearGradient id="innerLight"
x1="0%" y1="0%"
x2="100%" y2="100%">

<stop offset="0%" stop-color="#FFFFFF" stop-opacity=".95"/>
<stop offset="30%" stop-color="#C8ECFF" stop-opacity=".45"/>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>

</linearGradient>

  <!-- Blur -->
<filter id="blur40">
  <feGaussianBlur stdDeviation="40"/>
</filter>

<!-- Soft Blur -->
<filter id="blur12">
  <feGaussianBlur stdDeviation="12"/>
</filter>

<!-- Glow -->
<filter id="glow">
  <feGaussianBlur stdDeviation="10" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

</defs>

<!-- OUTER GLOW -->
<ellipse
cx="210"
cy="215"
rx="170"
ry="215"
fill="url(#outerGlow)"
filter="url(#blur40)"
opacity=".95"/>
<!-- MAIN SHIELD -->
<path
d="M210 35
C305 55 360 110 360 205
L360 275
C360 365 305 435 210 492
C115 435 60 365 60 275
L60 205
C60 110 115 55 210 35Z"
fill="url(#shieldMain)"
filter="url(#glow)"/>
<!-- INNER SHIELD -->
<path
d="M210 62
C286 78 330 122 330 200
L330 258
C330 332 286 392 210 440
C134 392 90 332 90 258
L90 200
C90 122 134 78 210 62Z"
fill="url(#innerLight)"
opacity=".28"/>

<!-- LEFT SHADOW -->
<path
d="M210 35
C150 60 115 120 115 210
L115 270
C115 330 145 382 210 430"
fill="none"
stroke="#001B5A"
stroke-width="14"
stroke-opacity=".28"/>
<!-- RIGHT HIGHLIGHT -->
<path
d="M210 42
C270 60 308 110 308 195
L308 255
C308 315 278 365 220 408"
fill="none"
stroke="#A8E8FF"
stroke-width="8"
stroke-linecap="round"
stroke-opacity=".48"/>

<!-- CENTER SHINE -->
<path
d="M168 95
C188 82 220 82 242 95
C214 150 202 250 214 345"
fill="none"
stroke="#FFFFFF"
stroke-width="10"
stroke-linecap="round"
stroke-opacity=".12"/>
