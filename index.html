<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================
         BASIC SETTINGS
    ========================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>A1 Rewards</title>

    <!-- Main CSS -->

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- =========================
         LOGIN PAGE
    ========================== -->

    <section id="loginPage">
        <div class="top-bar">
📢 Join A1 Rewards & Start Earning Exciting Rewards!
</div>

<header class="main-header">

    <div class="logo-area">

        <h1>
            <span class="blue">A1</span>
            REWARDS
        </h1>

        <p>
            Powered by
            <span>A1 MOBILE</span>
        </p>

    </div>

<button class="menu-btn">
<svg width="30" height="22" viewBox="0 0 24 24">
    <path d="M3 6H21M3 12H21M3 18H21"
          stroke="#111"
          stroke-width="2.5"
          stroke-linecap="round"/>
</svg>
</button>

</header>

<div class="hero">

    <h2>
        Welcome
        <span>Back!</span>
    </h2>

    <p class="subtitle">
        Login to access your A1 Rewards account
    </p>
<div class="login-card">
<div class="input-group">
    <label class="input-label">Mobile Number</label>

    <div class="input-field">
        <div class="left-icon">
            <img src="images/contact-icon.png" alt="">
        </div>

        <input
            type="tel"
            placeholder="Enter your mobile number">

        <div class="right-icon">
            <img src="images/card.svg" alt="">
        </div>
    </div>
</div>

<div class="input-group password-group">
    <label class="input-label">Password</label>

    <div class="input-field">
        <div class="left-icon">
            <img src="images/lock.png" alt="">
        </div>

        <input
            type="password"
            id="password"
            placeholder="Enter your password">

        <div class="right-icon">
            <img src="images/eye.svg" alt="Show Password">
        </div>
    </div>
</div>
    <div class="remember-row">

    <label class="remember-me">
        <input type="checkbox" checked>
        <span>Remember me</span>
    </label>

    <a href="#" class="forgot-password">
        Forgot Password?
    </a>

    </div>
    <button class="login-btn">
    <img src="images/login.svg" alt="">
    Login
    </button>
<div class="or-divider">
    <span></span>
    <b>OR</b>
    <span></span>
</div>

<div class="register-box">

    <div class="register-icon">
        <img src="images/register.svg" alt="Register">
    </div>

    <div class="register-text">
        <strong>New to A1 Rewards?</strong>
        <small>Create an account and start earning rewards.</small>
    </div>

    <button class="register-btn">
        Register Now
        <span>›</span>
    </button>

</div>
    
</div>
        <img src="images/right-flow.png" class="hero-right-flow" alt="">

    <div class="security-center">

    <img src="images/security-rings.png" class="security-rings" alt="">

        <h1 class="hero-title">
    Welcome <span>Back!</span>
</h1>

<p class="hero-text">
    Login to access your A1 Rewards account
</p>

    </div>
    
    <div class="hero-stars">
    <span style="top:95px;left:45px;opacity:1.8;"></span>
    <span style="top:15px;left:300px;opacity:.30;"></span>
    <span style="top:45px;left:280px;opacity:1.5;"></span>
    <span style="top:120px;left:320px;opacity:.90;"></span>
    <span style="top:200px;left:355px;opacity:.1;"></span>
    <span style="top:210px;left:370px;opacity:.90;"></span>
    <span style="top:240px;left:373px;opacity:.1;"></span>
    <span style="top:45px;left:260px;opacity:.1;"></span>
    </div>
</div>
    </div>
    </section>
<script src="script.js"></script>
</body>

</html>
